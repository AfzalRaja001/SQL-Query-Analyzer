# Render Blueprint for the QueryLab backend (Express + Prisma + Postgres)
# Deploy: push this file, then in Render -> "New +" -> "Blueprint" -> pick this repo.
# Render reads this file and provisions the database + web service automatically.

databases:
  - name: querylab-db
    plan: free          # free Postgres expires after 30 days; upgrade for persistence
    databaseName: queryanalyzer
    user: queryanalyzer

services:
  - type: web
    name: querylab-api
    runtime: node
    plan: free
    rootDir: server      # all commands below run inside ./server
    # install deps, generate the Prisma client, apply migrations, then compile TS
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # Admin connection used by Prisma — auto-wired from the database above
      - key: DATABASE_URL
        fromDatabase:
          name: querylab-db
          property: connectionString

      # Read-only connection for safe query execution.
      # Point this at the SAME Render DB (or any reachable Postgres) you want users to query.
      # Set the value in the Render dashboard after the DB is created.
      - key: TARGET_DB_URL
        sync: false

      # 32-byte hex key for encrypting saved connection passwords — Render generates it once.
      - key: CONNECTION_ENC_KEY
        generateValue: true

      # The deployed frontend origin (your Vercel URL). Fill in after deploying the client.
      # e.g. https://querylab.vercel.app  (no trailing slash)
      - key: CLIENT_ORIGIN
        sync: false
