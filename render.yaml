# Render Blueprint for the QueryLab backend (Express + Prisma).
# Database lives on Neon — this file only provisions the web service.
# Deploy: push, then in Render -> "New +" -> "Blueprint" -> pick this repo.

services:
  - type: web
    name: querylab-api
    runtime: node
    plan: free           # free web service sleeps after 15 min idle; upgrade to "starter" for always-on
    rootDir: server      # all commands below run inside ./server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # Neon OWNER connection string — Prisma uses it to migrate + write history.
      # Paste it in the Render dashboard (Connect -> Pooled connection, sslmode=require).
      - key: DATABASE_URL
        sync: false

      # Neon READ-ONLY connection string (the readonly_user you created).
      # Used for safe query execution.
      - key: TARGET_DB_URL
        sync: false

      # 32-byte hex key for encrypting saved connection passwords — Render generates it once.
      - key: CONNECTION_ENC_KEY
        generateValue: true

      # Your deployed frontend origin (Vercel URL, no trailing slash). Fill in after Vercel deploy.
      - key: CLIENT_ORIGIN
        sync: false
